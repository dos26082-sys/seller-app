<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CRM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d1117;
  --bg2: #161b22;
  --bg3: #1c2128;
  --card: #161b22;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.04);
  --accent: #58a6ff;
  --accent2: #1f6feb;
  --green: #3fb950;
  --green2: #238636;
  --purple: #bc8cff;
  --pink: #f778ba;
  --yellow: #e3b341;
  --text: #e6edf3;
  --text2: #8b949e;
  --text3: #484f58;
  --shadow: 0 1px 0 rgba(255,255,255,0.04);
  --glow-blue: 0 0 20px rgba(88,166,255,0.15);
}

body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 90px;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(88,166,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(88,166,255,0.03) 1px, transparent 1px);
  background-size: 32px 32px;
  pointer-events: none;
  z-index: 0;
}

body > * { position: relative; z-index: 1; }

/* SPLASH */
.splash {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.6s ease, visibility 0.6s ease;
}

.splash.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.splash img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  animation: splashPulse 2.4s ease-in-out infinite;
}

@keyframes splashPulse {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.15); }
}

.splash-loading {
  position: absolute;
  bottom: 60px;
  left: 0; right: 0;
  text-align: center;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11px;
  letter-spacing: 3px;
  color: #58a6ff;
  text-transform: uppercase;
  text-shadow: 0 0 12px rgba(88,166,255,0.6);
}

.splash-loading::after {
  content: '';
  display: inline-block;
  width: 6px;
  height: 6px;
  margin-left: 8px;
  border-radius: 50%;
  background: #58a6ff;
  box-shadow: 0 0 10px #58a6ff;
  animation: blink 1s ease-in-out infinite;
}

/* HEADER */
.header {
  background: rgba(13,17,23,0.92);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo { display: flex; align-items: center; gap: 10px; }

.logo-mark {
  width: 30px; height: 30px;
  background: linear-gradient(135deg, var(--accent), var(--purple));
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  box-shadow: var(--glow-blue);
}

.logo-text {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 17px; font-weight: 700; color: var(--text); letter-spacing: -0.3px;
}

.logo-sub {
  font-size: 10px; color: var(--text3); letter-spacing: 1.5px;
  text-transform: uppercase; margin-top: 1px;
}

.status-pill {
  display: flex; align-items: center; gap: 5px;
  background: rgba(63,185,80,0.1);
  border: 1px solid rgba(63,185,80,0.2);
  border-radius: 20px; padding: 4px 10px;
  font-size: 11px; font-weight: 600; color: var(--green); letter-spacing: 0.5px;
}

.status-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--green);
  animation: blink 2s ease-in-out infinite;
}

@keyframes blink {
  0%,100% { opacity:1; box-shadow: 0 0 6px var(--green); }
  50% { opacity:0.4; box-shadow: none; }
}

/* TABS */
.tabs {
  display: flex;
  background: rgba(13,17,23,0.9);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 59px; z-index: 99;
  padding: 0 8px;
}

.tab {
  flex: 1; padding: 11px 4px; text-align: center;
  font-size: 12px; font-weight: 500; color: var(--text3);
  border: none; background: transparent; cursor: pointer;
  border-bottom: 2px solid transparent;
  font-family: 'Inter', sans-serif;
  transition: all 0.2s; letter-spacing: 0.2px;
}

.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

.section { display: none; padding: 14px; }
.section.active { display: block; }

/* CARD */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 10px;
  overflow: hidden;
  box-shadow: var(--shadow);
}

.card-head {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border2);
  display: flex; align-items: center; justify-content: space-between;
}

.card-label {
  font-size: 11px; font-weight: 600; color: var(--text3);
  text-transform: uppercase; letter-spacing: 1px;
}

.card-body { padding: 14px; }

/* WEEK BANNER */
.week-banner {
  background: linear-gradient(135deg, rgba(88,166,255,0.08), rgba(188,140,255,0.08));
  border: 1px solid rgba(88,166,255,0.15);
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.week-info-label {
  font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px;
}

.week-info-val {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px; font-weight: 600; color: var(--text);
}

.btn-week-reset {
  padding: 7px 12px;
  border-radius: 8px;
  border: 1px solid rgba(88,166,255,0.25);
  background: rgba(88,166,255,0.08);
  color: var(--accent);
  font-size: 12px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
}

/* STAT GRID */
.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 10px;
}

.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  position: relative;
  overflow: hidden;
}

.stat-card::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 2px;
  border-radius: 12px 12px 0 0;
}

.sc1::after { background: linear-gradient(90deg, var(--accent), var(--purple)); }
.sc2::after { background: linear-gradient(90deg, var(--green), #56d364); }
.sc3::after { background: linear-gradient(90deg, var(--purple), var(--pink)); }
.sc4::after { background: linear-gradient(90deg, var(--yellow), var(--pink)); }

.stat-num {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 28px; font-weight: 700; color: var(--text);
  letter-spacing: -0.5px; line-height: 1; margin-bottom: 4px;
}

.stat-lbl { font-size: 12px; color: var(--text2); font-weight: 500; }
.stat-period { font-size: 10px; color: var(--text3); margin-top: 2px; letter-spacing: 0.5px; }

/* FORM */
.form-group { margin-bottom: 12px; }

.form-group label {
  display: block; font-size: 12px; font-weight: 500; color: var(--text2);
  margin-bottom: 6px; letter-spacing: 0.2px;
}

.form-group input, .form-group textarea {
  width: 100%; padding: 10px 13px;
  border: 1px solid var(--border); border-radius: 8px;
  font-size: 14px; font-family: 'Inter', sans-serif;
  background: var(--bg3); color: var(--text);
  outline: none; transition: all 0.15s; -webkit-appearance: none;
}

.form-group input:focus, .form-group textarea:focus {
  border-color: var(--accent2);
  box-shadow: 0 0 0 3px rgba(31,111,235,0.15);
  background: var(--bg2);
}

.form-group input::placeholder, .form-group textarea::placeholder { color: var(--text3); }
.form-group textarea { min-height: 70px; resize: vertical; line-height: 1.5; }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* BUTTONS */
.btn {
  display: block; width: 100%; padding: 12px;
  border-radius: 8px; border: none;
  font-size: 14px; font-weight: 600;
  font-family: 'Inter', sans-serif; cursor: pointer;
  transition: all 0.15s; letter-spacing: 0.2px;
}

.btn:active { transform: scale(0.97); }

.btn-primary {
  background: var(--accent2); color: #fff;
  border: 1px solid rgba(88,166,255,0.3);
  box-shadow: 0 0 20px rgba(31,111,235,0.25);
}
.btn-primary:hover { background: #388bfd; }

.btn-green-solid {
  background: var(--green2); color: #fff;
  border: 1px solid rgba(63,185,80,0.3);
  box-shadow: 0 0 20px rgba(35,134,54,0.25);
}

.btn-muted {
  background: var(--bg3); color: var(--text2);
  border: 1px solid var(--border);
}

.btn-sm {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 11px; border-radius: 6px;
  font-size: 12px; font-weight: 600;
  font-family: 'Inter', sans-serif; cursor: pointer;
  border: 1px solid; transition: all 0.15s;
}

.bsm-red { background: rgba(248,81,73,0.1); color: #f85149; border-color: rgba(248,81,73,0.2); }
.bsm-green { background: rgba(63,185,80,0.1); color: var(--green); border-color: rgba(63,185,80,0.2); }
.bsm-cb { background: rgba(227,179,65,0.1); color: var(--yellow); border-color: rgba(227,179,65,0.2); }

/* SETTINGS ICON BUTTON */
.salary-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}

.btn-icon-sm {
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--text2);
  font-size: 15px;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-icon-sm:active { transform: scale(0.93); }
.btn-icon-sm:hover { color: var(--accent); border-color: rgba(88,166,255,0.25); }

/* EXPORT BUTTON */
.btn-export {
  padding: 7px 14px;
  border-radius: 8px;
  border: 1px solid rgba(88,166,255,0.25);
  background: rgba(88,166,255,0.08);
  color: var(--accent);
  font-size: 12px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
}

/* SEARCH BAR */
.search-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 9px 13px;
  margin-bottom: 10px;
}

.search-icon { font-size: 14px; flex-shrink: 0; }

.search-bar input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  color: var(--text);
}

.search-bar input::placeholder { color: var(--text3); }

/* STATUS PICKER */
.status-picker {
  display: flex;
  gap: 6px;
}

.status-opt {
  flex: 1;
  padding: 8px 4px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--text2);
  font-size: 12px;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
}

.status-opt.active {
  border-color: var(--accent2);
  background: rgba(31,111,235,0.12);
  color: var(--text);
  font-weight: 600;
}

/* STATUS BADGE ON CARD */
.status-badge {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  margin-bottom: 4px;
}

.sb-work { background: rgba(88,166,255,0.12); color: var(--accent); border: 1px solid rgba(88,166,255,0.2); }
.sb-done { background: rgba(63,185,80,0.12); color: var(--green); border: 1px solid rgba(63,185,80,0.2); }
.sb-fail { background: rgba(248,81,73,0.12); color: #f85149; border: 1px solid rgba(248,81,73,0.2); }

/* AUTOCOMPLETE SUGGESTIONS */
.suggestions {
  position: absolute;
  top: calc(100% + 2px);
  left: 0; right: 0;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  z-index: 50;
  overflow: hidden;
  display: none;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}

.suggestions.visible { display: block; }

.suggestion-item {
  padding: 9px 13px;
  font-size: 14px;
  color: var(--text);
  cursor: pointer;
  border-bottom: 1px solid var(--border2);
}

.suggestion-item:last-child { border-bottom: none; }
.suggestion-item:active { background: rgba(255,255,255,0.05); }

/* WEEK HISTORY */
.week-history-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 11px 14px;
  margin-bottom: 7px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.wh-left {}
.wh-period { font-size: 11px; color: var(--text3); letter-spacing: 0.5px; margin-bottom: 2px; }
.wh-clients { font-size: 13px; font-weight: 600; color: var(--text); }
.wh-sum { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700; color: var(--green); }
.empty-history { font-size: 13px; color: var(--text3); text-align: center; padding: 12px 0; }

/* CLIENT CARD */
.client-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 8px;
  overflow: hidden;
  position: relative;
  transition: border-color 0.2s;
}

.client-card.is-open {
  border-color: rgba(88,166,255,0.25);
}

.client-card::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
  background: linear-gradient(180deg, var(--accent), var(--purple));
  opacity: 0.7;
}

.client-top {
  padding: 12px 14px 12px 16px;
  display: flex; justify-content: space-between; align-items: center;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}

.client-top-left { flex: 1; }
.client-top-right { flex-shrink: 0; margin-left: 10px; }

.client-preview {
  font-size: 13px;
  color: var(--green);
  font-weight: 600;
  margin-top: 3px;
  font-family: 'Space Grotesk', sans-serif;
}

.chevron {
  color: var(--text3);
  transition: transform 0.25s ease;
  display: flex; align-items: center;
}

.chevron.open {
  transform: rotate(180deg);
  color: var(--accent);
}

.client-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease;
}

.client-body.open {
  max-height: 2000px;
}

.client-num {
  font-size: 10px; font-weight: 600; color: var(--text3);
  letter-spacing: 1px; text-transform: uppercase; margin-bottom: 3px;
}

.client-name {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: -0.2px;
}

.client-meta { padding: 0 14px 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; }

.meta-item { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--text2); }
.meta-icon { font-size: 12px; }

.badges { padding: 0 14px 10px 16px; display: flex; gap: 6px; flex-wrap: wrap; }

.badge {
  padding: 3px 10px; border-radius: 20px;
  font-size: 12px; font-weight: 600; border: 1px solid;
}

.b1 { background: rgba(88,166,255,0.1); color: var(--accent); border-color: rgba(88,166,255,0.2); }
.b2 { background: rgba(188,140,255,0.1); color: var(--purple); border-color: rgba(188,140,255,0.2); }

.comment-box {
  margin: 0 14px 10px 16px;
  padding: 8px 12px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border2);
  border-left: 2px solid var(--text3);
  border-radius: 0 6px 6px 0;
  font-size: 13px; color: var(--text2); line-height: 1.5;
}

.client-date {
  padding: 0 14px 10px 16px;
  font-size: 11px; color: var(--text3); letter-spacing: 0.3px;
}

/* PAYMENTS */
.payments-block { border-top: 1px solid var(--border2); padding: 10px 14px 12px 16px; }
.payments-block + .payments-block { border-top: 1px solid var(--border2); }

.payments-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.payments-title { font-size: 12px; font-weight: 600; color: var(--text2); letter-spacing: 0.3px; }

.payment-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 10px;
  background: rgba(63,185,80,0.06);
  border: 1px solid rgba(63,185,80,0.12);
  border-radius: 8px; margin-bottom: 5px;
}

.payment-row.cb-row {
  background: rgba(227,179,65,0.06);
  border: 1px solid rgba(227,179,65,0.12);
}

.pay-amount.cb-amount { color: var(--yellow); }

.pay-amount {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 15px; font-weight: 700; color: var(--green); letter-spacing: -0.3px;
}

.pay-note { font-size: 12px; color: var(--text2); margin-top: 2px; }
.pay-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.pay-date { font-size: 11px; color: var(--text3); font-weight: 500; }

.total-row {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border2);
}

.total-label { font-size: 12px; font-weight: 600; color: var(--text2); letter-spacing: 0.3px; }

.total-val {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 16px; font-weight: 700; color: var(--text);
}

.no-payments { font-size: 12px; color: var(--text3); padding: 4px 0; }

/* STATUS SWITCH ON CARD */
.status-switch-btn {
  padding: 5px 11px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--text2);
  transition: all 0.15s;
}
.status-switch-btn:active { transform: scale(0.95); }
.status-switch-btn.ssb-active {
  background: rgba(88,166,255,0.12);
  border-color: rgba(88,166,255,0.3);
  color: var(--text);
}

/* SALARY */
.salary-center { text-align: center; padding: 18px 0 10px; }

.salary-num {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 48px; font-weight: 700; color: var(--green);
  letter-spacing: -1px; line-height: 1;
  text-shadow: 0 0 40px rgba(63,185,80,0.3);
}

.salary-cur { font-size: 14px; color: var(--text2); font-weight: 500; margin-top: 4px; letter-spacing: 0.5px; }

.info-table { margin-top: 14px; border-top: 1px solid var(--border2); padding-top: 10px; }

.info-row {
  display: flex; justify-content: space-between; padding: 8px 0;
  border-bottom: 1px solid var(--border2); font-size: 13px;
}
.info-row:last-child { border-bottom: none; }
.info-row-label { color: var(--text2); }
.info-row-val { font-weight: 600; color: var(--text); }

/* MODAL */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
  z-index: 200; align-items: flex-end;
}
.modal-overlay.open { display: flex; }

.modal {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 16px 16px 0 0;
  padding: 16px 18px 28px; width: 100%;
}

.modal-handle { width: 32px; height: 3px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }

.modal-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 16px; font-weight: 700; color: var(--text);
  margin-bottom: 14px; letter-spacing: -0.2px;
}

.btn-row { display: flex; gap: 8px; margin-top: 4px; }
.btn-row .btn { flex: 1; }

/* EMPTY */
.empty { text-align: center; padding: 50px 20px; color: var(--text3); }
.empty-icon { font-size: 36px; margin-bottom: 10px; }
.empty-t { font-size: 15px; font-weight: 600; color: var(--text2); margin-bottom: 4px; }
.empty-s { font-size: 13px; color: var(--text3); }
</style>
</head>
<body>

<div class="splash" id="splash">
  <img src="splash.png" alt="SKOLL">
  <div class="splash-loading">Loading</div>
</div>

<div class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-mark">⚡</div>
      <div>
        <div class="logo-text">Sales CRM</div>
        <div class="logo-sub">Management System</div>
      </div>
    </div>
    <div class="status-pill">
      <div class="status-dot"></div>
      LIVE
    </div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" id="tab-btn-clients" onclick="showTab('clients')">Клиенты</button>
  <button class="tab" onclick="showTab('add')">Добавить</button>
  <button class="tab" onclick="showTab('stats')">Статистика</button>
  <button class="tab" onclick="showTab('salary')">Зарплата</button>
</div>

<div id="tab-clients" class="section active">
  <div class="search-bar">
    <span class="search-icon">🔍</span>
    <input type="text" id="search-input" placeholder="Поиск по имени или телефону..." oninput="renderClients()">
  </div>
  <div id="clients-list"></div>
</div>

<div id="tab-add" class="section">
  <div class="card">
    <div class="card-head"><div class="card-label">Новый клиент</div></div>
    <div class="card-body">
      <div class="form-group">
        <label>ФИО</label>
        <input type="text" id="f-name" placeholder="Иванов Иван Иванович">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Телефон</label>
          <input type="tel" id="f-phone" placeholder="+7 999 000 00 00">
        </div>
        <div class="form-group">
          <label>Регион</label>
          <input type="text" id="f-region" placeholder="Москва">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Этап 1 — менеджер</label>
          <input type="text" id="f-m1" placeholder="Имя" autocomplete="off" oninput="showSuggestions('f-m1','sug-m1')" onfocus="showSuggestions('f-m1','sug-m1')" onblur="hideSuggestions('sug-m1')">
          <div class="suggestions" id="sug-m1"></div>
        </div>
        <div class="form-group">
          <label>Этап 2 — менеджер</label>
          <input type="text" id="f-m2" placeholder="Имя" autocomplete="off" oninput="showSuggestions('f-m2','sug-m2')" onfocus="showSuggestions('f-m2','sug-m2')" onblur="hideSuggestions('sug-m2')">
          <div class="suggestions" id="sug-m2"></div>
        </div>
      </div>
      <div class="form-group">
        <label>Статус</label>
        <div class="status-picker" id="status-picker">
          <button type="button" class="status-opt active" data-status="work" onclick="pickStatus(this)">🔵 В работе</button>
          <button type="button" class="status-opt" data-status="done" onclick="pickStatus(this)">🟢 Закрыт</button>
          <button type="button" class="status-opt" data-status="fail" onclick="pickStatus(this)">🔴 Отказ</button>
        </div>
      </div>
      <div class="form-group">
        <label>Комментарий</label>
        <textarea id="f-comment" placeholder="Детали сделки..."></textarea>
      </div>
      <button class="btn btn-primary" onclick="addClient()">Добавить клиента</button>
    </div>
  </div>
</div>

<div id="tab-stats" class="section">
  <div class="week-banner">
    <div>
      <div class="week-info-label">Текущая неделя</div>
      <div class="week-info-val" id="week-range">—</div>
    </div>
    <button class="btn-week-reset" onclick="startNewWeek()">Новая неделя</button>
  </div>

  <div class="card-label" style="margin-bottom:8px;padding-left:2px">За эту неделю</div>
  <div class="stat-grid" id="stats-week"></div>

  <div class="card-label" style="margin:14px 0 8px;padding-left:2px">За этот месяц</div>
  <div class="stat-grid" id="stats-month"></div>

  <div class="card-label" style="margin:14px 0 8px;padding-left:2px">Всего</div>
  <div class="stat-grid" id="stats-total"></div>
  <div class="card-label" style="margin:14px 0 8px;padding-left:2px">История недель</div>
  <div id="stats-history"></div>
</div>

<div id="tab-salary" class="section">
  <div class="salary-toolbar">
    <button class="btn-icon-sm" onclick="openRateModal()" title="Настройки курса">⚙️</button>
    <button class="btn-export" onclick="exportData()">📤 Экспорт</button>
  </div>
  <div class="card">
    <div class="card-body" id="salary-result"></div>
  </div>
</div>

<div class="modal-overlay" id="payment-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="payment-modal-title">Новый платёж</div>
    <div class="form-group">
      <label>Сумма (₽)</label>
      <input type="text" id="pm-sum" placeholder="50 000" inputmode="numeric" oninput="formatNumberInput(this)">
    </div>
    <div class="form-group">
      <label>Комментарий</label>
      <input type="text" id="pm-note" placeholder="Аванс, финал...">
    </div>
    <div class="btn-row">
      <button class="btn btn-green-solid" onclick="savePayment()">Добавить</button>
      <button class="btn btn-muted" onclick="closeModal()">Отмена</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="rate-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Настройка курса</div>
    <div class="form-group" style="margin:0 0 14px">
      <label>Грн за каждые 100 000 ₽</label>
      <input type="text" id="rate" value="2 850" inputmode="numeric" oninput="formatNumberInput(this)">
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="saveRate()">Сохранить</button>
      <button class="btn btn-muted" onclick="closeRateModal()">Отмена</button>
    </div>
  </div>
</div>

<script>
if (window.Telegram && window.Telegram.WebApp) {
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}

setTimeout(function() {
  const splash = document.getElementById('splash');
  if (splash) splash.classList.add('hide');
}, 1800);

let clients = JSON.parse(localStorage.getItem('crm_v6') || '[]');
let weekStart = localStorage.getItem('crm_week_start');
if (!weekStart) {
  weekStart = Date.now();
  localStorage.setItem('crm_week_start', weekStart);
}
weekStart = parseInt(weekStart);

let conversionRate = parseFloat(localStorage.getItem('crm_rate')) || 2850;
let weekHistory = JSON.parse(localStorage.getItem('crm_week_history') || '[]');

let activePaymentClientId = null;
let expandedCards = new Set();
let selectedStatus = 'work';

// STATUS
const STATUS_MAP = {
  work: { label: '🔵 В работе', cls: 'sb-work' },
  done: { label: '🟢 Закрыт',  cls: 'sb-done' },
  fail: { label: '🔴 Отказ',   cls: 'sb-fail' }
};

function pickStatus(btn) {
  document.querySelectorAll('.status-opt').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedStatus = btn.dataset.status;
}

// AUTOCOMPLETE
function getManagerNames() {
  const names = new Set();
  clients.forEach(c => {
    if (c.m1) names.add(c.m1);
    if (c.m2) names.add(c.m2);
  });
  return [...names];
}

function showSuggestions(inputId, sugId) {
  const input = document.getElementById(inputId);
  const sug = document.getElementById(sugId);
  const val = input.value.trim().toLowerCase();
  const names = getManagerNames().filter(n => n.toLowerCase().includes(val) && n !== input.value);
  if (!names.length || !val) { sug.classList.remove('visible'); sug.innerHTML = ''; return; }
  sug.innerHTML = names.slice(0, 4).map(n =>
    `<div class="suggestion-item" onmousedown="pickSuggestion('${inputId}','${sugId}','${n}')">${n}</div>`
  ).join('');
  sug.classList.add('visible');
}

function hideSuggestions(sugId) {
  setTimeout(() => {
    const el = document.getElementById(sugId);
    if (el) { el.classList.remove('visible'); el.innerHTML = ''; }
  }, 150);
}

function pickSuggestion(inputId, sugId, name) {
  document.getElementById(inputId).value = name;
  hideSuggestions(sugId);
}

// HAPTIC
function haptic(style) {
  try {
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
      window.Telegram.WebApp.HapticFeedback.impactOccurred(style || 'light');
    }
  } catch(e) {}
}

// EXPORT
function exportData() {
  const data = { clients, weekStart, conversionRate, weekHistory, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'crm-backup-' + new Date().toLocaleDateString('ru-RU').replace(/\./g,'-') + '.json';
  a.click();
  URL.revokeObjectURL(url);
  haptic('medium');
}

function toggleCard(id) {
  if (expandedCards.has(id)) {
    expandedCards.delete(id);
  } else {
    expandedCards.add(id);
    haptic('light');
  }
  renderClients();
}

function formatNumber(num) {
  if (num === null || num === undefined || num === '') return '';
  return Number(num).toLocaleString('ru-RU').replace(/,/g, ' ');
}

function formatNumberInput(input) {
  const cursorFromEnd = input.value.length - input.selectionStart;
  const digits = input.value.replace(/\D/g, '');
  if (!digits) { input.value = ''; return; }
  const formatted = formatNumber(parseInt(digits, 10));
  input.value = formatted;
  const pos = Math.max(formatted.length - cursorFromEnd, 0);
  input.setSelectionRange(pos, pos);
}

function save() { localStorage.setItem('crm_v6', JSON.stringify(clients)); }

function showTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  const names = ['clients','add','stats','salary'];
  document.querySelectorAll('.tab')[names.indexOf(name)].classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'stats') renderStats();
  if (name === 'salary') calcSalary();
  if (name === 'clients') renderClients();
}

function addClient() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { alert('Введите ФИО'); return; }
  clients.unshift({
    id: Date.now(),
    createdAt: Date.now(),
    name,
    phone: document.getElementById('f-phone').value.trim(),
    region: document.getElementById('f-region').value.trim(),
    m1: document.getElementById('f-m1').value.trim(),
    m2: document.getElementById('f-m2').value.trim(),
    comment: document.getElementById('f-comment').value.trim(),
    status: selectedStatus,
    payments: [],
    cbPayments: []
  });
  save();
  haptic('medium');
  ['f-name','f-phone','f-region','f-m1','f-m2','f-comment'].forEach(id => document.getElementById(id).value = '');
  selectedStatus = 'work';
  document.querySelectorAll('.status-opt').forEach(b => b.classList.toggle('active', b.dataset.status === 'work'));
  updateTabCounter();
  showTab('clients');
}

function deleteClient(id) {
  if (!confirm('Удалить клиента?')) return;
  clients = clients.filter(c => c.id !== id);
  expandedCards.delete(id);
  save(); updateTabCounter(); renderClients();
}

function changeStatus(id, newStatus) {
  const client = clients.find(c => c.id === id);
  if (!client) return;
  client.status = newStatus;
  save(); haptic('light'); renderClients();
}

let activePaymentType = 'payments';

function openPaymentModal(clientId, type) {
  activePaymentClientId = clientId;
  activePaymentType = type || 'payments';
  document.getElementById('pm-sum').value = '';
  document.getElementById('pm-note').value = '';
  document.getElementById('payment-modal-title').textContent = activePaymentType === 'cb' ? 'Новый платёж с ЦБ' : 'Новый платёж';
  document.getElementById('payment-modal').classList.add('open');
  setTimeout(() => document.getElementById('pm-sum').focus(), 150);
}

function closeModal() {
  document.getElementById('payment-modal').classList.remove('open');
  activePaymentClientId = null;
}

function savePayment() {
  const sum = parseFloat(document.getElementById('pm-sum').value.replace(/\s/g, ''));
  if (!sum) { alert('Введите сумму'); return; }
  const client = clients.find(c => c.id === activePaymentClientId);
  if (!client) return;
  const key = activePaymentType === 'cb' ? 'cbPayments' : 'payments';
  if (!client[key]) client[key] = [];
  client[key].push({
    id: Date.now(),
    sum,
    note: document.getElementById('pm-note').value.trim(),
    date: new Date().toLocaleDateString('ru-RU', {day:'2-digit',month:'2-digit',year:'2-digit'})
  });
  save(); haptic('light'); closeModal(); renderClients();
}

function deletePayment(clientId, paymentId, type) {
  const client = clients.find(c => c.id === clientId);
  if (!client) return;
  const key = type === 'cb' ? 'cbPayments' : 'payments';
  client[key] = client[key].filter(p => p.id !== paymentId);
  save(); renderClients();
}

function totalPayments(client) {
  const a = (client.payments || []).reduce((a, p) => a + p.sum, 0);
  const b = (client.cbPayments || []).reduce((a, p) => a + p.sum, 0);
  return a + b;
}

function renderClients() {
  const el = document.getElementById('clients-list');
  const query = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
  let filtered = clients;
  if (query) {
    filtered = clients.filter(c =>
      c.name.toLowerCase().includes(query) ||
      (c.phone || '').toLowerCase().includes(query) ||
      (c.region || '').toLowerCase().includes(query)
    );
  }
  if (!filtered.length) {
    el.innerHTML = query
      ? `<div class="empty"><div class="empty-icon">🔍</div><div class="empty-t">Ничего не найдено</div><div class="empty-s">Попробуйте другой запрос</div></div>`
      : `<div class="empty"><div class="empty-icon">👤</div><div class="empty-t">Клиентов пока нет</div><div class="empty-s">Нажмите «Добавить» чтобы начать</div></div>`;
    return;
  }
  el.innerHTML = filtered.map((c, i) => {
    const total = totalPayments(c);
    const payments = c.payments || [];
    const cbPayments = c.cbPayments || [];
    const dateStr = c.createdAt ? new Date(c.createdAt).toLocaleDateString('ru-RU', {day:'2-digit',month:'2-digit',year:'numeric'}) : '';
    const isOpen = expandedCards.has(c.id);
    const status = STATUS_MAP[c.status || 'work'];
    const globalIdx = clients.indexOf(c);
    return `
      <div class="client-card ${isOpen ? 'is-open' : ''}">
        <div class="client-top" onclick="toggleCard(${c.id})">
          <div class="client-top-left">
            <div class="client-num">CLIENT · #${String(clients.length - globalIdx).padStart(3,'0')}</div>
            <div class="client-name">${c.name}</div>
            ${!isOpen ? `<div style="display:flex;align-items:center;gap:6px;margin-top:4px"><span class="status-badge ${status.cls}">${status.label}</span>${total > 0 ? `<span style="font-size:12px;color:var(--green);font-weight:600">${total.toLocaleString('ru-RU')} ₽</span>` : ''}</div>` : ''}
          </div>
          <div class="client-top-right">
            <div class="chevron ${isOpen ? 'open' : ''}">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
          </div>
        </div>

        <div class="client-body ${isOpen ? 'open' : ''}">
          <div style="padding: 8px 14px 8px 16px; display:flex; gap:6px; flex-wrap:wrap;">
            ${Object.entries(STATUS_MAP).map(([key, s]) =>
              `<button class="status-switch-btn ${(c.status||'work') === key ? 'ssb-active' : ''}" onclick="event.stopPropagation(); changeStatus(${c.id},'${key}')">${s.label}</button>`
            ).join('')}
          </div>

          ${(c.phone || c.region) ? `
          <div class="client-meta">
            ${c.phone ? `<div class="meta-item"><span class="meta-icon">📞</span>${c.phone}</div>` : ''}
            ${c.region ? `<div class="meta-item"><span class="meta-icon">📍</span>${c.region}</div>` : ''}
          </div>` : ''}

          ${(c.m1 || c.m2) ? `
          <div class="badges">
            ${c.m1 ? `<span class="badge b1">Этап 1 · ${c.m1}</span>` : ''}
            ${c.m2 ? `<span class="badge b2">Этап 2 · ${c.m2}</span>` : ''}
          </div>` : ''}

          ${c.comment ? `<div class="comment-box">${c.comment}</div>` : ''}
          ${dateStr ? `<div class="client-date">Добавлен: ${dateStr}</div>` : ''}

          <div class="payments-block">
            <div class="payments-head">
              <div class="payments-title">Платежи${payments.length ? ` (${payments.length})` : ''}</div>
              <button class="btn-sm bsm-green" onclick="event.stopPropagation(); openPaymentModal(${c.id}, 'payments')">+ Добавить</button>
            </div>
            ${payments.length ? `
              ${payments.map(p => `
                <div class="payment-row">
                  <div>
                    <div class="pay-amount">+${p.sum.toLocaleString('ru-RU')} ₽</div>
                    ${p.note ? `<div class="pay-note">${p.note}</div>` : ''}
                  </div>
                  <div class="pay-right">
                    <div class="pay-date">${p.date}</div>
                    <button class="btn-sm bsm-red" style="padding:3px 8px;font-size:11px" onclick="event.stopPropagation(); deletePayment(${c.id},${p.id},'payments')">✕</button>
                  </div>
                </div>
              `).join('')}
            ` : `<div class="no-payments">Платежей нет</div>`}
          </div>

          <div class="payments-block">
            <div class="payments-head">
              <div class="payments-title">Платежи с ЦБ${cbPayments.length ? ` (${cbPayments.length})` : ''}</div>
              <button class="btn-sm bsm-cb" onclick="event.stopPropagation(); openPaymentModal(${c.id}, 'cb')">+ Добавить</button>
            </div>
            ${cbPayments.length ? `
              ${cbPayments.map(p => `
                <div class="payment-row cb-row">
                  <div>
                    <div class="pay-amount cb-amount">+${p.sum.toLocaleString('ru-RU')} ₽</div>
                    ${p.note ? `<div class="pay-note">${p.note}</div>` : ''}
                  </div>
                  <div class="pay-right">
                    <div class="pay-date">${p.date}</div>
                    <button class="btn-sm bsm-red" style="padding:3px 8px;font-size:11px" onclick="event.stopPropagation(); deletePayment(${c.id},${p.id},'cb')">✕</button>
                  </div>
                </div>
              `).join('')}
            ` : `<div class="no-payments">Платежей с ЦБ нет</div>`}
            <div class="total-row">
              <span class="total-label">ИТОГО ПО КЛИЕНТУ</span>
              <span class="total-val">${total.toLocaleString('ru-RU')} ₽</span>
            </div>
          </div>

          <div style="padding: 0 14px 12px 16px;">
            <button class="btn-sm bsm-red" onclick="event.stopPropagation(); deleteClient(${c.id})">✕ Удалить клиента</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function updateTabCounter() {
  const btn = document.getElementById('tab-btn-clients');
  if (btn) btn.textContent = clients.length ? `Клиенты · ${clients.length}` : 'Клиенты';
}

function startNewWeek() {
  if (!confirm('Начать новую неделю? Текущая статистика будет сохранена в историю.')) return;

  // Save current week to history
  const weekClients = clients.filter(c => (c.createdAt || 0) >= weekStart);
  const weekSum = weekClients.reduce((a, c) => a + totalPayments(c), 0);
  const startD = new Date(weekStart);
  const endD = new Date();
  const fmt = d => d.toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit'});

  if (weekClients.length > 0) {
    weekHistory.unshift({
      period: `${fmt(startD)} — ${fmt(endD)}`,
      clientCount: weekClients.length,
      sum: weekSum
    });
    if (weekHistory.length > 20) weekHistory = weekHistory.slice(0, 20);
    localStorage.setItem('crm_week_history', JSON.stringify(weekHistory));
  }

  weekStart = Date.now();
  localStorage.setItem('crm_week_start', weekStart);
  haptic('medium');
  renderStats();
}

function countInRange(fromTs) {
  const inRange = clients.filter(c => (c.createdAt || 0) >= fromTs);
  return {
    total: inRange.length,
    m1: inRange.filter(c => c.m1).length,
    m2: inRange.filter(c => c.m2).length
  };
}

function renderStatGroup(elId, data, periodLabel) {
  document.getElementById(elId).innerHTML = `
    <div class="stat-card sc1" style="grid-column: span 2">
      <div class="stat-num">${data.total}</div>
      <div class="stat-lbl">Клиентов</div>
      <div class="stat-period">${periodLabel}</div>
    </div>
  `;
}

function renderStats() {
  // week range label
  const startD = new Date(weekStart);
  const now = new Date();
  const fmt = d => d.toLocaleDateString('ru-RU', {day:'2-digit',month:'2-digit'});
  document.getElementById('week-range').textContent = `${fmt(startD)} — ${fmt(now)}`;

  // month start
  const monthStart = new Date();
  monthStart.setDate(1);
  monthStart.setHours(0,0,0,0);

  renderStatGroup('stats-week', countInRange(weekStart), 'за неделю');
  renderStatGroup('stats-month', countInRange(monthStart.getTime()), 'за месяц');
  renderStatGroup('stats-total', countInRange(0), 'всего');
  renderWeekHistory();
}

function renderWeekHistory() {
  const el = document.getElementById('stats-history');
  if (!el) return;
  if (!weekHistory.length) {
    el.innerHTML = '<div class="empty-history">История недель пока пуста</div>';
    return;
  }
  el.innerHTML = weekHistory.map(w => `
    <div class="week-history-item">
      <div class="wh-left">
        <div class="wh-period">${w.period}</div>
        <div class="wh-clients">${w.clientCount} ${w.clientCount === 1 ? 'клиент' : w.clientCount < 5 ? 'клиента' : 'клиентов'}</div>
      </div>
      <div class="wh-sum">${w.sum.toLocaleString('ru-RU')} ₽</div>
    </div>
  `).join('');
}

function openRateModal() {
  document.getElementById('rate').value = formatNumber(conversionRate);
  document.getElementById('rate-modal').classList.add('open');
}

function closeRateModal() {
  document.getElementById('rate-modal').classList.remove('open');
}

function saveRate() {
  const val = parseFloat(document.getElementById('rate').value.replace(/\s/g, ''));
  conversionRate = isNaN(val) ? 0 : val;
  localStorage.setItem('crm_rate', conversionRate);
  closeRateModal();
  calcSalary();
}

let usdRate = null;

async function fetchUsdRate() {
  try {
    const res = await fetch('https://api.exchangerate-api.com/v4/latest/UAH');
    const data = await res.json();
    usdRate = 1 / data.rates.USD;
  } catch(e) {
    try {
      const res2 = await fetch('https://open.er-api.com/v6/latest/UAH');
      const data2 = await res2.json();
      usdRate = 1 / data2.rates.USD;
    } catch(e2) {
      usdRate = null;
    }
  }
}

async function calcSalary() {
  const rate = conversionRate;
  const totalSum = clients.reduce((a,c) => a + totalPayments(c), 0);
  const salary = Math.round((totalSum / 100000) * rate);

  if (usdRate === null) {
    document.getElementById('salary-result').innerHTML = `
      <div class="salary-center">
        <div style="font-size:12px;font-weight:600;color:var(--text2);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px">Зарплата</div>
        <div class="salary-num">${salary.toLocaleString('ru-RU')}</div>
        <div class="salary-cur">гривен ₴</div>
        <div style="font-size:12px;color:var(--text3);margin-top:8px">Загрузка курса USD...</div>
      </div>
      <div class="info-table">
        <div class="info-row">
          <span class="info-row-label">Сумма сделок</span>
          <span class="info-row-val">${totalSum.toLocaleString('ru-RU')} ₽</span>
        </div>
        <div class="info-row">
          <span class="info-row-label">Клиентов</span>
          <span class="info-row-val">${clients.length}</span>
        </div>
      </div>
    `;
    await fetchUsdRate();
    calcSalary();
    return;
  }

  const salaryUsd = usdRate ? (salary / usdRate).toFixed(0) : null;
  const usdDisplay = salaryUsd
    ? `<div style="margin-top:10px;padding:8px 14px;background:rgba(88,166,255,0.07);border:1px solid rgba(88,166,255,0.15);border-radius:10px;display:inline-block">
        <span style="font-size:11px;color:var(--text3);letter-spacing:0.8px;text-transform:uppercase">≈ в долларах</span><br>
        <span style="font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;color:var(--accent)">$${Number(salaryUsd).toLocaleString('ru-RU')}</span>
        <span style="font-size:11px;color:var(--text3);margin-left:4px">курс: 1$ = ${usdRate.toFixed(1)} ₴</span>
       </div>`
    : '';

  document.getElementById('salary-result').innerHTML = `
    <div class="salary-center">
      <div style="font-size:12px;font-weight:600;color:var(--text2);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px">Зарплата</div>
      <div class="salary-num">${salary.toLocaleString('ru-RU')}</div>
      <div class="salary-cur">гривен ₴</div>
      ${usdDisplay}
    </div>
    <div class="info-table">
      <div class="info-row">
        <span class="info-row-label">Сумма сделок</span>
        <span class="info-row-val">${totalSum.toLocaleString('ru-RU')} ₽</span>
      </div>
      <div class="info-row">
        <span class="info-row-label">Клиентов</span>
        <span class="info-row-val">${clients.length}</span>
      </div>
    </div>
  `;
}

document.getElementById('payment-modal').addEventListener('click', function(e) {
  if(e.target === this) closeModal();
});

document.getElementById('rate-modal').addEventListener('click', function(e) {
  if(e.target === this) closeRateModal();
});

renderClients();
updateTabCounter();
fetchUsdRate();
</script>
</body>
</html>
